name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and tests (with PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: climate
          POSTGRES_PASSWORD: climate
          POSTGRES_DB: climate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U climate" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Enables the `postgres` tests (throw-away schemas, dropped after each test).
      TEST_DATABASE_URL: postgresql://climate:climate@localhost:5432/climate
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check . --output-format github

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest (offline suite + PostgreSQL integration)
        run: >-
          uv run pytest --cov=climate_pipeline --cov-report=term-missing --cov-fail-under=70
          --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml

  docker:
    name: Docker image (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/climate-pipeline:latest
            ghcr.io/${{ github.repository_owner }}/climate-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: docker run --rm "ghcr.io/${{ github.repository_owner }}/climate-pipeline:${{ github.sha }}" --help
        if: github.event_name == 'push'

  network-smoke:
    name: Public endpoints smoke test (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # upstream servers may rate-limit CI runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m network
