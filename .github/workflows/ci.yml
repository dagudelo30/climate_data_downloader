name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check . --output-format github

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest (offline suite)
        run: uv run pytest --cov=climate_pipeline --cov-report=term-missing --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/junit.xml

  network-smoke:
    name: Public endpoints smoke test (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # upstream servers may rate-limit CI runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m network
