# Scheduled, latency-aware incremental ingestion: Bronze → Silver (one job per source, in
# parallel) → Gold (one job, every target grid).
#
# State lives in a GCS bucket (repository variable DATA_BUCKET, e.g. gs://my-climate-lake):
# runners are ephemeral, so every job pulls what it needs and pushes what it produced. The
# catalog is one Parquet file per source, so parallel ingest jobs never write the same file.
#
# Required configuration:
#   vars.DATA_BUCKET              gs://bucket[/prefix] holding the data lake
#   vars.GEE_PROJECT              Google Cloud project registered for Earth Engine
#   vars.GCP_WORKLOAD_IDENTITY    Workload Identity Federation provider resource name
#   vars.GCP_SERVICE_ACCOUNT      service account (Storage + Earth Engine access)
#   secrets.CDSAPI_KEY            Copernicus CDS personal access token (AgERA5)
#   secrets.MSWEP_SA_KEY          optional: service-account JSON with access to the MSWEP Drive
#
# Until vars.DATA_BUCKET is set the workflow is a no-op (every job is skipped), so the daily
# schedule does not fail on forks or before the infrastructure exists.
name: Data pipeline

on:
  schedule:
    # 07:30 UTC = 02:30 Colombia, after the overnight publication windows of CHC/CDS/GEE.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources"
        default: "imerg,agera5,gee,era5land,modis,viirs,smap,landsat,goes,sentinel1"
      start_date:
        description: "YYYY-MM-DD (empty = latency-aware lookback window)"
        required: false
      end_date:
        description: "YYYY-MM-DD (empty = latest date each source can have)"
        required: false
      force:
        description: "Re-download even if Bronze is final"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation

concurrency:
  group: data-pipeline  # never two runs writing the lake at the same time
  cancel-in-progress: false

env:
  AOI_PATH: data/auxiliary/shapefiles/cali/cali.shp
  CONFIG_PATH: examples/cali_operational/pipeline.yaml
  CLIMATE_DATA_ROOT: data
  DATA_BUCKET: ${{ vars.DATA_BUCKET }}
  GEE_PROJECT: ${{ vars.GEE_PROJECT }}
  SOURCES: ${{ inputs.sources || 'imerg,agera5,gee,era5land,modis,viirs,smap,landsat,goes,sentinel1' }}
  # Dispatch inputs reach the shell as environment variables, never interpolated into scripts.
  START_DATE: ${{ inputs.start_date }}
  END_DATE: ${{ inputs.end_date }}
  FORCE_INPUT: ${{ inputs.force }}
  # One Gold store per grid: gold/1km and gold/5km (MAGNA-SIRGAS 2018 / Origen-Nacional).
  # Gold grids, each built from the native Silver (add --nested to derive them from the finest).
  TARGET_GRIDS: --target-grid 100m=EPSG:9377@100 --target-grid 500m=EPSG:9377@500 --target-grid 1km=EPSG:9377@1000 --target-grid 5km=EPSG:9377@5000

jobs:
  plan:
    name: Plan (latency window per source)
    if: vars.DATA_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.15", enable-cache: true }
      - run: uv sync --locked --no-dev
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull catalog
        run: |
          mkdir -p data/state/manifest
          gcloud storage rsync --recursive "$DATA_BUCKET/state/manifest" data/state/manifest || echo "empty lake"
      - id: plan
        run: |
          WINDOW="--incremental"
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            WINDOW="--no-incremental --start-date $START_DATE --end-date $END_DATE"
          fi
          FORCE=$([ "$FORCE_INPUT" = "true" ] && echo "--force" || echo "--no-force")
          uv run climate-pipeline plan --aoi-path "$AOI_PATH" --sources "$SOURCES" --config "$CONFIG_PATH" \
            $WINDOW $FORCE | tee plan.json
          MATRIX=$(uv run climate-pipeline plan --aoi-path "$AOI_PATH" --sources "$SOURCES" \
            --config "$CONFIG_PATH" $WINDOW $FORCE --github-matrix)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has_work=$([ "$MATRIX" = '{"source": []}' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          { echo '### Ingestion plan'; echo '```json'; cat plan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ingest:
    name: Ingest ${{ matrix.source }} (Bronze → Silver)
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false  # one provider being down must not block the others
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.15", enable-cache: true }
      - run: uv sync --locked --no-dev
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull this source's catalog and Bronze
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p data/state/manifest "data/bronze/$SOURCE"
          gcloud storage cp "$DATA_BUCKET/state/manifest/$SOURCE.parquet" data/state/manifest/ || true
          gcloud storage rsync --recursive "$DATA_BUCKET/bronze/$SOURCE" "data/bronze/$SOURCE" || true
      - name: Write MSWEP credentials
        if: matrix.source == 'mswep'
        env:
          MSWEP_SA_KEY: ${{ secrets.MSWEP_SA_KEY }}
        run: printf '%s' "$MSWEP_SA_KEY" > "$RUNNER_TEMP/mswep.json"
      - name: Run Bronze → Silver
        id: run
        continue-on-error: true  # partial failures are reported, Gold still runs
        env:
          SOURCE: ${{ matrix.source }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          GEE_SERVICE_ACCOUNT_KEY: ${{ steps.auth.outputs.credentials_file_path }}
          MSWEP_SERVICE_ACCOUNT_KEY: ${{ matrix.source == 'mswep' && format('{0}/mswep.json', runner.temp) || '' }}
        run: |
          WINDOW="--incremental"
          if [ -n "$START_DATE" ] && [ -n "$END_DATE" ]; then
            WINDOW="--start-date $START_DATE --end-date $END_DATE"
          fi
          FORCE=$([ "$FORCE_INPUT" = "true" ] && echo "--force" || echo "--no-force")
          uv run climate-pipeline run --aoi-path "$AOI_PATH" --sources "$SOURCE" \
            --config "$CONFIG_PATH" $WINDOW $FORCE --skip-gold \
            --report-path "reports/ingest_$SOURCE.json"
      - name: Push Bronze, Silver and catalog
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          for layer in bronze silver; do
            [ -d "data/$layer/$SOURCE" ] && gcloud storage rsync --recursive "data/$layer/$SOURCE" "$DATA_BUCKET/$layer/$SOURCE"
          done
          [ -f "data/state/manifest/$SOURCE.parquet" ] && \
            gcloud storage cp "data/state/manifest/$SOURCE.parquet" "$DATA_BUCKET/state/manifest/"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-${{ matrix.source }}
          path: reports/
      - name: Fail the job if the source reported errors
        if: steps.run.outcome == 'failure'
        run: exit 1

  gold:
    name: Gold (1 km + 5 km, daily + epi-weekly)
    needs: [plan, ingest]
    # Run even if some ingest jobs failed: Gold is rebuilt from whatever Silver changed.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.9.15", enable-cache: true }
      - run: uv sync --locked --no-dev
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull catalog, Silver and Gold
        run: |
          mkdir -p data/state data/silver data/gold
          gcloud storage rsync --recursive "$DATA_BUCKET/state" data/state || true
          gcloud storage rsync --recursive "$DATA_BUCKET/silver" data/silver || true
          gcloud storage rsync --recursive "$DATA_BUCKET/gold" data/gold || true
      - name: Build Gold (Parquet and DuckDB)
        run: |
          for format in parquet duckdb; do
            uv run climate-pipeline build-gold --aoi-path "$AOI_PATH" $TARGET_GRIDS \
              --output-format "$format" --config "$CONFIG_PATH" --report-path "reports/gold_$format.json"
          done
      - name: Static covariates (first run only)
        run: |
          # Terrain + urban form (Earth Engine) + OSM roads, computed on each grid.
          if [ ! -f "data/gold/100m/parquet/static/covariates.parquet" ]; then
            for format in parquet duckdb; do
              uv run climate-pipeline build-static --aoi-path "$AOI_PATH" \
                --grid-name 100m --grid-name 500m --grid-name 1km --grid-name 5km --layers terrain,urban,osm \
                --output-format "$format"
            done
          fi
      - name: Push Gold and catalog
        run: |
          gcloud storage rsync --recursive data/gold "$DATA_BUCKET/gold"
          gcloud storage rsync --recursive data/state "$DATA_BUCKET/state"
      - name: Summary
        if: always()
        run: |
          { echo '### Gold'; echo '```json'; cat reports/gold_parquet.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-reports
          path: reports/
